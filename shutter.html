<script type="text/javascript">
    // Isolate the code in a function to avoid global variable leaks
    (function () {
        "use strict";

        RED.nodes.registerType("shutter", {
            category: "home automation",
            color: "#DDAA99",
            defaults: {
                name: { value: "" },
                deviceUp: {
                    value: "",
                    required: true,
                    validate: RED.validators.typedInput("deviceUpType", false),
                },
                deviceUpType: { value: "str" },
                deviceDown: {
                    value: "",
                    required: true,
                    validate: RED.validators.typedInput("deviceDownType", false),
                },
                deviceDownType: { value: "str" },
                durationUp: {
                    value: "1000",
                    required: true,
                    validate: RED.validators.typedInput("durationUpType", false),
                },
                durationUpType: { value: "num" },
                durationDown: {
                    value: "1000",
                    required: true,
                    validate: RED.validators.typedInput("durationDownType", false),
                },
                durationDownType: { value: "num" },
                identifier: {
                    value: "",
                    required: true,
                    validate: RED.validators.typedInput("identifierType", false),
                },
                identifierType: { value: "str" },
                payloadOn: {
                    value: "1",
                    required: true,
                    validate: RED.validators.typedInput("payloadOnType", false),
                },
                payloadOnType: { value: "num" },
                payloadOff: {
                    value: "0",
                    required: true,
                    validate: RED.validators.typedInput("payloadOffType", false),
                },
                payloadOffType: { value: "num" },
                contextScope: { value: "global" },
                contextStore: { value: "" },
                logging: { value: false },
            },
            inputs: 1,
            outputs: 2,
            icon: "font-awesome/fa-window-maximize",
            label: function () {
                return this.name || (this.identifierType === "str" ? this.identifier : "") || "shutter";
            },
            paletteLabel: "shutter",
            inputLabels: "command",
            outputLabels: ["relay command", "status"],
            oneditprepare: function () {
                $("#node-input-deviceUp").typedInput({
                    default: this.deviceUpType || "str",
                    types: ["str", "msg", "flow", "global", "env"],
                    typeField: $("#node-input-deviceUpType"),
                });
                $("#node-input-deviceDown").typedInput({
                    default: this.deviceDownType || "str",
                    types: ["str", "msg", "flow", "global", "env"],
                    typeField: $("#node-input-deviceDownType"),
                });
                $("#node-input-durationUp").typedInput({
                    default: this.durationUpType || "num",
                    types: ["num", "msg", "flow", "global", "env"],
                    typeField: $("#node-input-durationUpType"),
                });
                $("#node-input-durationDown").typedInput({
                    default: this.durationDownType || "num",
                    types: ["num", "msg", "flow", "global", "env"],
                    typeField: $("#node-input-durationDownType"),
                });
                $("#node-input-identifier").typedInput({
                    default: this.identifierType || "str",
                    types: ["str", "msg", "flow", "global", "env"],
                    typeField: $("#node-input-identifierType"),
                });
                $("#node-input-payloadOn").typedInput({
                    default: this.payloadOnType || "num",
                    types: ["num", "str", "bool"],
                    typeField: $("#node-input-payloadOnType"),
                });
                $("#node-input-payloadOff").typedInput({
                    default: this.payloadOffType || "num",
                    types: ["num", "str", "bool"],
                    typeField: $("#node-input-payloadOffType"),
                });

                // Populate the context store dropdown from Node-RED settings.
                var storeField = $("#node-input-contextStore");
                storeField.empty();
                storeField.append($("<option></option>").val("").text("(default)"));
                try {
                    var ctxSettings = RED.settings.context;
                    var stores = (ctxSettings && ctxSettings.stores) || [];
                    stores.forEach(function (store) {
                        storeField.append($("<option></option>").val(store).text(store));
                    });
                } catch (e) {
                    // RED.settings.context may be unavailable; keep just the default.
                }
                storeField.val(this.contextStore || "");
            },
        });
    })();
</script>

    <div class="form-row">

    <div class="form-row">

        <input type="text" id="node-input-deviceUp" placeholder="Relay device for opening" />

    <div class="form-row">

    <div class="form-row">

    </div>
    <div class="form-row">
        <label for="node-input-durationDown"><i class="fa fa-clock-o"></i> Duration down (ms)</label>
        <input type="text" id="node-input-durationDown" placeholder="1000" />
        <input type="hidden" id="node-input-durationDownType" />
    </div>
    <div class="form-row">
        <label for="node-input-payloadOn"><i class="fa fa-toggle-on"></i> Payload on</label>
        <input type="text" id="node-input-payloadOn" placeholder="Relay energize value" />
        <input type="hidden" id="node-input-payloadOnType" />
    </div>
    <div class="form-row">
        <label for="node-input-payloadOff"><i class="fa fa-toggle-off"></i> Payload off</label>
        <input type="text" id="node-input-payloadOff" placeholder="Relay release value" />
        <input type="hidden" id="node-input-payloadOffType" />
    </div>
    <div class="form-row">
        <label for="node-input-contextScope"><i class="fa fa-database"></i> Context</label>
        <select id="node-input-contextScope" style="width:70%;">
            <option value="global">Global</option>
            <option value="flow">Flow</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-contextStore"><i class="fa fa-hdd-o"></i> Store</label>
        <select id="node-input-contextStore" style="width:70%;"></select>
    </div>
    <div class="form-row">
        <label for="node-input-logging"><i class="fa fa-file-text-o"></i> Logging</label>
        <input type="checkbox" id="node-input-logging" style="width: auto; vertical-align: top;" />
        <span> Enable debug logging</span>
    </div>
</script>

<script type="text/html" data-help-name="shutter">
    <p>Controls a roller shutter (or blind) using two relay outputs, with
    position tracking based on timed movement.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt class="optional">payload
            <span class="property-type">integer</span>
        </dt>
        <dd>target position as a percentage (0–100). The node calculates the
        required movement time and direction automatically.</dd>
        <dt class="optional">get_status
            <span class="property-type">any</span>
        </dt>
        <dd>when present (any value), the node responds with the current status
        without moving the shutter.</dd>
    </dl>

    <h3>Outputs</h3>
    <ol class="node-ports">
        <li>Relay command
            <dl class="message-properties">
                <dt>topic <span class="property-type">string</span></dt>
                <dd>the device identifier (up or down relay).</dd>
                <dt>payload <span class="property-type">number | string | boolean</span></dt>
                <dd>the configured <b>Payload on</b> value to energize the relay,
                or <b>Payload off</b> value to release it (defaults <code>1</code> / <code>0</code>).</dd>
                <dt>info <span class="property-type">string</span></dt>
                <dd>human-readable state string, e.g. <code>"device_up=true"</code>.</dd>
            </dl>
        </li>
        <li>Status
            <dl class="message-properties">
                <dt>payload.status <span class="property-type">string</span></dt>
                <dd>current state: <code>"opening"</code>, <code>"closing"</code>,
                <code>"closed"</code>, <code>"fully_opened"</code>, or <code>"opened"</code>.</dd>
                <dt>payload.position <span class="property-type">number</span></dt>
                <dd>current position from <code>0</code> (closed) to <code>1</code> (fully open).</dd>
            </dl>
        </li>
    </ol>

    <h3>Details</h3>
    <p>This node controls a roller shutter that uses two separate relays — one
    for the "up" motor direction and one for "down". Since there is no position
    feedback from the hardware, the node <b>estimates position by timing</b> the
    movement duration.</p>

    <h4>Configuration</h4>
    <p>All properties support dynamic sources (static value, <code>msg</code>,
    flow context, global context, or environment variable):</p>
    <ul>
        <li><b>Identifier</b> — unique name for this shutter, used in global state tracking.</li>
        <li><b>Device up / down</b> — relay device identifiers used as <code>msg.topic</code>
        on the first output.</li>
        <li><b>Duration up / down</b> — time in milliseconds for a full open or close cycle.</li>
        <li><b>Payload on / off</b> — value sent on the first output to energize
        (on) or release (off) the relay. Type can be number, string, or boolean
        (defaults <code>1</code> / <code>0</code> as numbers).</li>
    </ul>

    <h4>Movement</h4>
    <p>Send <code>msg.payload</code> as an integer percentage (0–100) to move to
    a specific position. The node calculates the direction (open or close) and the
    movement time automatically, and does nothing if the shutter is already at the
    requested position. Non-integer payloads are ignored with a warning.</p>
    <p>If a command arrives while the shutter is already moving, the node stops the
    active relay and updates the estimated position; send a new position afterwards
    to continue.</p>

    <h4>Live status</h4>
    <p>While moving, the node reports estimated position every 200ms on the second
    output and updates the node status display with a live percentage.</p>

    <h4>Context</h4>
    <p>The node persists its state in either <b>flow</b> or <b>global</b> context,
    selectable via the <b>Context</b> dropdown. An optional named <b>Store</b> can
    be chosen when multiple context stores are configured in Node-RED
    (<code>settings.js</code>); leave it as <code>(default)</code> to use the
    default store. Two entries are maintained under the chosen scope/store:</p>
    <ul>
        <li><code>shutters</code> — persistent position map:
        <code>{ "identifier": { position, changed } }</code></li>
        <li><code>shutters-config</code> — runtime state:
        <code>{ unlimited: bool, active: [...] }</code></li>
    </ul>
    <p>Setting <code>shutters-config.unlimited = true</code> disables position
    limits (useful for calibration or shutters without end stops).</p>

    <h4>Node status</h4>
    <p>The node shows a green ring with position when idle, or a red ring with
    direction and percentage while moving.</p>

    <h3>References</h3>
    <ul>
        <li><a href="https://github.com/lnowakowski/node-red-contrib-shutter">GitHub</a> - the node's GitHub repository</li>
    </ul>
</script>
